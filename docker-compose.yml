services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lostfound_local}
      POSTGRES_DB: lostfound
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
